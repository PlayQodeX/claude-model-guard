<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#171226"/>
      <stop offset="60%" stop-color="#0d0b16"/>
      <stop offset="100%" stop-color="#08070e"/>
    </radialGradient>
    <linearGradient id="track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- left: name + tagline -->
  <circle cx="110" cy="120" r="8" fill="#f87171"/>
  <circle cx="110" cy="120" r="15" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.5"/>
  <text x="140" y="130" font-family="DejaVu Sans Mono" font-size="26" fill="#9a93b8">passive audit log</text>

  <text x="100" y="230" font-family="DejaVu Sans" font-size="64" font-weight="bold" fill="#f4f2fb">claude-model-guard</text>
  <text x="100" y="296" font-family="DejaVu Sans" font-size="30" fill="#9a93b8">Logs every model switch and classifier block</text>
  <text x="100" y="340" font-family="DejaVu Sans" font-size="30" fill="#9a93b8">in Claude Code. Local only, md + pdf reports.</text>

  <!-- mini diverging track, bottom -->
  <path d="M 100 500 L 420 500" stroke="#60a5fa" stroke-width="4" fill="none"/>
  <path d="M 100 500 L 420 500" stroke="#60a5fa" stroke-width="10" fill="none" opacity="0.18" filter="url(#soft)"/>
  <circle cx="420" cy="500" r="12" fill="#0d0b16" stroke="#c4b5fd" stroke-width="3.5"/>
  <path d="M 420 500 C 510 500 540 430 630 418 L 760 408" stroke="#5d5878" stroke-width="3.5" stroke-dasharray="8 10" fill="none" opacity="0.75"/>
  <g transform="translate(830,404) rotate(-6)">
    <rect x="-72" y="-24" width="160" height="48" rx="7" fill="none" stroke="#7a7396" stroke-width="2.5"/>
    <text x="8" y="10" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="24" fill="#8d86ab" letter-spacing="5">REFUSED</text>
  </g>
  <path d="M 420 500 C 520 500 550 560 660 572 L 800 580" stroke="url(#track)" stroke-width="4" fill="none"/>
  <path d="M 420 500 C 520 500 550 560 660 572 L 800 580" stroke="#8b5cf6" stroke-width="11" fill="none" opacity="0.20" filter="url(#soft)"/>
  <rect x="810" y="556" width="196" height="48" rx="24" fill="#161028" stroke="#8b5cf6" stroke-width="2"/>
  <text x="908" y="588" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="23" fill="#ddd0fe">opus-4-8</text>
  <rect x="30" y="476" width="150" height="48" rx="24" fill="#101024" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="508" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="23" fill="#bfd7fe">fable-5</text>

  <!-- right: log card -->
  <rect x="880" y="100" width="330" height="200" rx="14" fill="#100e1d" stroke="#2a2542" stroke-width="2"/>
  <text x="910" y="150" font-family="DejaVu Sans Mono" font-size="20" fill="#8d86ab">model-switch-log.md</text>
  <text x="910" y="192" font-family="DejaVu Sans Mono" font-size="19" fill="#565170">22:14  fable-5 &#8594; opus-4-8</text>
  <text x="910" y="226" font-family="DejaVu Sans Mono" font-size="19" fill="#565170">22:47  auto-mode block</text>
  <text x="910" y="260" font-family="DejaVu Sans Mono" font-size="19" fill="#454060">23:30  daily scan</text>

  <text x="1180" y="600" text-anchor="end" font-family="DejaVu Sans" font-size="22" fill="#6f6990">@PlayQodeX</text>
